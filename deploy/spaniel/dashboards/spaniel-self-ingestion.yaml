version: 1
id: spaniel-self-ingestion
name: Spaniel ingestion and signal quality
description: Active-session ingestion, metric cardinality, log quality, and WebSocket delivery for $service. Lifetime
  counters use the latest sample per stream; windowed charts use reset-aware deltas or stored records.
magic_variables:
- name: session_id
  kind: string
variables:
- name: service
  kind: string
  source: spans.service_name
  default_value: spaniel
- name: window_minutes
  kind: number
  source: |
    SELECT
      60 AS value
  default_value: '60'
panels:
- title: Accepted telemetry points - process lifetime
  display_type: pie
  query: |
    -- Cumulative counters: take the latest value per attribute set, never sum snapshots.
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.ingest.metrics_points')
      GROUP BY
        name,
        attributes
    )
    SELECT
      coalesce(json_extract_string(attributes, '$.signal'), 'unknown') AS label,
      sum(value) AS value
    FROM latest
    WHERE
      json_extract_string(attributes, '$.result') = 'accepted'
    GROUP BY
      1
    ORDER BY
      value DESC
  settings:
    unit: points
  layout:
    x: 1
    y: 1
    w: 6
    h: 1
  position: 0
- title: Ingest request outcomes - process lifetime
  display_type: bar
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.ingest.requests')
      GROUP BY
        name,
        attributes
    )
    SELECT
      concat_ws(
        ' / ',
        json_extract_string(attributes, '$.signal'),
        json_extract_string(attributes, '$.protocol'),
        json_extract_string(attributes, '$.result')
      ) AS label,
      sum(value) AS value
    FROM latest
    GROUP BY
      1
    ORDER BY
      value DESC
    LIMIT 10
  settings:
    unit: requests
  layout:
    x: 7
    y: 1
    w: 6
    h: 1
  position: 1
- title: Storage rejecting ingestion (0 = no, 1 = yes)
  display_type: gauge
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.storage.full')
      GROUP BY
        name,
        attributes
    )
    SELECT
      value
    FROM latest
  settings:
    min: 0
    max: 1
  layout:
    x: 1
    y: 2
    w: 4
    h: 1
  position: 2
- title: Pending ingestion work
  display_type: single_value
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.ingest.queue.depth')
      GROUP BY
        name,
        attributes
    )
    SELECT
      value
    FROM latest
  settings: {}
  layout:
    x: 5
    y: 2
    w: 4
    h: 1
  position: 3
- title: Indexed active metric series
  display_type: single_value
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.metrics.active_series')
      GROUP BY
        name,
        attributes
    )
    SELECT
      value
    FROM latest
  settings: {}
  layout:
    x: 9
    y: 2
    w: 4
    h: 1
  position: 4
- title: Accepted points per bucket (observed counter deltas)
  display_type: time_series
  query: |
    -- Partition by counter epoch so restarts cannot create a negative delta.
    -- Keep the sample before the window; the first sample in each epoch has no known delta.
    WITH scope AS (
      SELECT
        CAST(
          epoch(CAST(current_timestamp AS TIMESTAMP)) * 1000000000 AS BIGINT
        ) - greatest(1, least(CAST($window_minutes AS BIGINT), 180)) * 60000000000 AS since_ns,
        (
          (
            greatest(1, least(CAST($window_minutes AS BIGINT), 180)) + 23
          ) // 24
        ) * 60000000000 AS bucket_ns
    ),
    samples AS (
      SELECT
        timestamp_ns,
        attributes,
        value,
        lag(value) OVER (
          PARTITION BY
            series_key,
            start_timestamp_ns
          ORDER BY timestamp_ns
        ) AS previous
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name = 'spaniel.ingest.metrics_points'
        AND json_extract_string(attributes, '$.result') = 'accepted'
    )
    SELECT
      (timestamp_ns // bucket_ns) * bucket_ns AS timestamp_ns,
      sum(greatest(value - previous, 0)) AS value,
      json_extract_string(attributes, '$.signal') AS group_value
    FROM samples
    CROSS JOIN scope
    WHERE
      timestamp_ns >= since_ns
      AND previous IS NOT NULL
    GROUP BY
      1,
      3
    ORDER BY
      1,
      3
    LIMIT 128
  settings: {}
  layout:
    x: 1
    y: 3
    w: 6
    h: 1
  position: 5
- title: Stored log severity distribution
  display_type: pie
  query: |
    WITH scope AS (
      SELECT
        CAST(
          epoch(CAST(current_timestamp AS TIMESTAMP)) * 1000000000 AS BIGINT
        ) - greatest(1, least(CAST($window_minutes AS BIGINT), 180)) * 60000000000 AS since_ns,
        (
          (
            greatest(1, least(CAST($window_minutes AS BIGINT), 180)) + 23
          ) // 24
        ) * 60000000000 AS bucket_ns
    )
    SELECT
      CASE
        WHEN severity >= 21 THEN 'FATAL'
        WHEN severity >= 17 THEN 'ERROR'
        WHEN severity >= 13 THEN 'WARN'
        WHEN severity >= 9 THEN 'INFO'
        WHEN severity >= 5 THEN 'DEBUG'
        ELSE 'TRACE / unspecified'
      END AS label,
      count(*) AS value
    FROM logs
    WHERE
      service_name = $service
      AND session_id = $session_id
      AND timestamp_ns >= (
        SELECT
          since_ns
        FROM scope
      )
    GROUP BY
      1
    ORDER BY
      value DESC
  settings:
    unit: logs
  layout:
    x: 7
    y: 3
    w: 6
    h: 1
  position: 6
- title: Logs linked to a trace (%)
  display_type: gauge
  query: |
    WITH scope AS (
      SELECT
        CAST(
          epoch(CAST(current_timestamp AS TIMESTAMP)) * 1000000000 AS BIGINT
        ) - greatest(1, least(CAST($window_minutes AS BIGINT), 180)) * 60000000000 AS since_ns,
        (
          (
            greatest(1, least(CAST($window_minutes AS BIGINT), 180)) + 23
          ) // 24
        ) * 60000000000 AS bucket_ns
    )
    SELECT
      100.0 * count(*) FILTER (WHERE length(trace_id) = 32 AND trace_id <> repeat('0', 32)) / nullif(count(*), 0) AS value
    FROM logs
    WHERE
      service_name = $service
      AND session_id = $session_id
      AND timestamp_ns >= (
        SELECT
          since_ns
        FROM scope
      )
  settings:
    min: 0
    max: 100
    unit: '%'
  layout:
    x: 1
    y: 4
    w: 4
    h: 1
  position: 7
- title: Pending ingestion payload (MiB)
  display_type: single_value
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.ingest.queue.bytes')
      GROUP BY
        name,
        attributes
    )
    SELECT
      value / 1048576.0 AS value
    FROM latest
  settings: {}
  layout:
    x: 5
    y: 4
    w: 4
    h: 1
  position: 8
- title: Active ingestion requests
  display_type: single_value
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.ingest.active_requests')
      GROUP BY
        name,
        attributes
    )
    SELECT
      value
    FROM latest
  settings: {}
  layout:
    x: 9
    y: 4
    w: 4
    h: 1
  position: 9
- title: WebSocket delivery outcomes - process lifetime
  display_type: bar
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.websocket.events')
      GROUP BY
        name,
        attributes
    )
    SELECT
      concat_ws(
        ' / ',
        json_extract_string(attributes, '$.event'),
        json_extract_string(attributes, '$.result')
      ) AS label,
      sum(value) AS value
    FROM latest
    GROUP BY
      1
    ORDER BY
      value DESC
    LIMIT 12
  settings:
    unit: events
  layout:
    x: 1
    y: 5
    w: 6
    h: 1
  position: 10
- title: Storage failures - process lifetime
  display_type: bar
  query: |
    WITH latest AS (
      SELECT
        name,
        attributes,
        arg_max(value, timestamp_ns) AS value
      FROM metrics
      WHERE
        service_name = $service
        AND session_id = $session_id
        AND name IN ('spaniel.storage.failures')
      GROUP BY
        name,
        attributes
    )
    SELECT
      attributes AS label,
      value
    FROM latest
    ORDER BY
      value DESC
    LIMIT 10
  settings:
    unit: failures
  layout:
    x: 7
    y: 5
    w: 6
    h: 1
  position: 11
