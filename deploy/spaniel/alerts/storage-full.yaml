version: 1
name: Spaniel storage full
query: |
  SELECT arg_max(value, timestamp_ns) AS value FROM metrics WHERE service_name = 'spaniel' AND name = 'spaniel.storage.full' AND timestamp_ns > epoch_ns(current_timestamp) - 300000000000
condition:
  kind: threshold
  operator: ">"
  threshold: 0
pending_for: 1m
cooldown: 5m
severity: warning
