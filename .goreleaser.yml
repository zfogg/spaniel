# GoReleaser config — see https://goreleaser.com
#
# DuckDB needs CGo, so cross-compile is fragile. CI builds each platform on
# its native runner (see .github/workflows/release.yml) and invokes goreleaser
# only with `--single-target` so each runner emits just its own artifacts.
# The release job then concatenates `dist/` from all runners and publishes.
#
# Local snapshot build for your host:
#   goreleaser build --snapshot --clean --single-target

version: 2

project_name: spaniel

before:
  hooks:
    - go mod tidy
    - bash -c "cd frontend && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: spaniel
    main: ./cmd/spaniel
    binary: spaniel
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # DuckDB CGo on windows/arm64 is not supported upstream.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: zfogg
    name: spaniel
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

brews:
  - name: spaniel
    repository:
      owner: zfogg
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/zfogg/spaniel
    description: Local OpenTelemetry collector and viewer
    license: MIT
    commit_author:
      name: zfogg-bot
      email: zach.fogg@gmail.com
    test: |
      system "#{bin}/spaniel", "--version"
    install: |
      bin.install "spaniel"
