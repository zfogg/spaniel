components:
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The request was invalid.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The requested Spaniel resource was not found.
    schemas:
        ActiveSession:
            properties:
                id:
                    type: string
                label:
                    type: string
            required:
                - id
                - label
            type: object
        AlertEvent:
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
            properties:
                created_at:
                    type: number
                detail:
                    type: string
                group_key:
                    type: string
                id:
                    type: string
                kind:
                    type: string
                rule_id:
                    type: string
                state:
                    type: string
                value:
                    type:
                        - number
                        - "null"
            required:
                - id
                - rule_id
                - group_key
                - kind
                - state
                - detail
                - created_at
            type: object
        AlertInstance:
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
            properties:
                acknowledged_at:
                    type:
                        - number
                        - "null"
                acknowledgement_note:
                    type: string
                fired_at:
                    type:
                        - number
                        - "null"
                first_pending_at:
                    type:
                        - number
                        - "null"
                group_key:
                    type: string
                labels_json:
                    type: string
                last_error:
                    type: string
                last_evaluated_at:
                    type: number
                resolved_at:
                    type:
                        - number
                        - "null"
                rule_id:
                    type: string
                state:
                    type: string
                value:
                    type:
                        - number
                        - "null"
            required:
                - rule_id
                - group_key
                - labels_json
                - state
                - acknowledgement_note
                - last_evaluated_at
                - last_error
            type: object
        AlertList:
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
            properties:
                items:
                    items:
                        additionalProperties: false
                        properties:
                            annotations_json:
                                type: string
                            browser_enabled:
                                type: boolean
                            condition_json:
                                type: string
                            cooldown_ns:
                                type: number
                            created_at:
                                type: number
                            enabled:
                                type: boolean
                            group_by_json:
                                type: string
                            id:
                                type: string
                            instance_discovery_interval_ns:
                                type: number
                            instance_discovery_last_run_at:
                                type: number
                            instance_discovery_sql:
                                type: string
                            instance_discovery_stale_after_ns:
                                type: number
                            instances:
                                default: []
                                items:
                                    additionalProperties: false
                                    properties:
                                        acknowledged_at:
