                    items:
                        additionalProperties: false
                        properties:
                            acknowledged_at:
                                type:
                                    - number
                                    - "null"
                            acknowledgement_note:
                                type: string
                            fired_at:
                                type:
                                    - number
                                    - "null"
                            first_pending_at:
                                type:
                                    - number
                                    - "null"
                            group_key:
                                type: string
                            labels_json:
                                type: string
                            last_error:
                                type: string
                            last_evaluated_at:
                                type: number
                            resolved_at:
