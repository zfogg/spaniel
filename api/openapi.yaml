                            last_duration_ns:
                                type: number
                            last_error:
                                type: string
                            last_evaluated_at:
                                type: number
                            last_success_at:
                                type: number
                            name:
                                type: string
                            next_evaluation_at:
                                type: number
                            pending_for_ns:
                                type: number
                            pushover_enabled:
                                type: boolean
                            query_sql:
                                type: string
                            query_version:
                                type: number
                            repeat_interval_ns:
                                type: number
                            severity:
                                enum:
                                    - info
                                    - warning
                                    - critical
                                type: string
                            source_file:
                                type: string
                            source_hash:
                                type: string
                            updated_at:
                                type: number
                        required:
                            - id
                            - name
                            - query_sql
                            - query_version
                            - condition_json
                            - group_by_json
                            - annotations_json
