                last_duration_ns:
                    type: number
                last_error:
                    type: string
                last_evaluated_at:
                    type: number
                last_success_at:
                    type: number
                name:
                    type: string
                next_evaluation_at:
                    type: number
                pending_for_ns:
                    type: number
                pushover_enabled:
                    type: boolean
                query_sql:
                    type: string
                query_version:
                    type: number
                repeat_interval_ns:
                    type: number
                severity:
