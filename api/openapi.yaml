                cooldown_ns:
                    type: number
                created_at:
                    type: number
                enabled:
                    type: boolean
                group_by_json:
                    type: string
                id:
                    type: string
                instance_discovery_interval_ns:
                    type: number
                instance_discovery_last_run_at:
                    type: number
                instance_discovery_sql:
                    type: string
                instance_discovery_stale_after_ns:
                    type: number
                instances:
