                                                - number
                                                - "null"
                                        acknowledgement_note:
                                            type: string
                                        fired_at:
                                            type:
                                                - number
                                                - "null"
                                        first_pending_at:
                                            type:
                                                - number
                                                - "null"
                                        group_key:
                                            type: string
                                        labels_json:
                                            type: string
                                        last_error:
                                            type: string
                                        last_evaluated_at:
                                            type: number
                                        resolved_at:
                                            type:
                                                - number
                                                - "null"
                                        rule_id:
                                            type: string
                                        state:
                                            type: string
                                        value:
                                            type:
                                                - number
                                                - "null"
                                    required:
                                        - rule_id
                                        - group_key
                                        - labels_json
                                        - state
                                        - acknowledgement_note
                                        - last_evaluated_at
                                        - last_error
