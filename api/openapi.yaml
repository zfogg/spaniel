                summary:
                    additionalProperties: false
                    properties:
                        instance_counts:
                            additionalProperties:
                                type: number
                            propertyNames:
                                type: string
                            type: object
                        rule_counts:
                            additionalProperties:
                                type: number
                            propertyNames:
                                type: string
                            type: object
                    required:
                        - rule_counts
                        - instance_counts
                    type: object
            required:
                - items
                - summary
            type: object
