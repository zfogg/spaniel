services:
  spaniel:
    image: ${SPANIEL_IMAGE:-ghcr.io/zfogg/spaniel:latest}
    command: ["--db-path", "/data/spaniel.duckdb", "--no-browser", "--mcp-allow-writes"]
    container_name: spaniel
    restart: unless-stopped
    ports:
      - "8080:8080"   # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - spaniel-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2s

volumes:
  spaniel-data:
