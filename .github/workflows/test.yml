name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make build
      - name: Exercise live authentication and capture screenshots
        env:
          SPANIEL_OTLP_GRPC_PORT: '18317'
          SPANIEL_OTLP_HTTP_PORT: '18318'
          SPANIEL_SELF_MONITOR: 'false'
          SPANIEL_E2E_BASE_URL: http://127.0.0.1:18280
          SPANIEL_E2E_SECURITY: '1'
        run: |
          mkdir -p .local
          make run ARGS='--port 18280 --db-path .local/telemetry.duckdb --no-browser' >.local/security-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18280/api/health >/dev/null; then break; fi
            sleep 1
          done
          cd frontend
          pnpm exec playwright test e2e/security-live.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-ui-screenshots
          path: frontend/test-results/**/screenshots/*.png
          retention-days: 30
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend (required by go:embed)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go test ./internal/... ./cmd/... -race -count=1
      - run: make test-mcp-e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
